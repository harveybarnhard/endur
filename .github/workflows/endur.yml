name: Pull and clean data

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE'
      - 'NOTES.txt'
      - 'README.md'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Recompute Manhattan coverage from scratch (re-fetches every activity)'
        type: boolean
        default: false

concurrency:
  group: endur
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.8
      uses: actions/setup-python@v3
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests datetime
    - name: Decrypt tokens
      run: sh endur/decrypt_secret.sh
      env:
        STRAVA_TOKENS_PHRASE: ${{ secrets.STRAVA_TOKENS_PHRASE }}
    - name: Pull data
      run: |
        python endur/get_data_again.py
      env:
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
    - name: Prepare data for visualization
      run: |
        python endur/data_sample.py
    - name: Encrypt tokens and remove unencrypted tokens
      run: |
        sh endur/encrypt_secret.sh
        rm ./data/strava_tokens.json
      env:
        STRAVA_TOKENS_PHRASE: ${{ secrets.STRAVA_TOKENS_PHRASE }}
    - name: Create time badge
      run: |
        datenow=$(date "+%s")
        before="date\/"
        after="\?color"
        sed -i "s|$before\(.*\)$after|$before$datenow$after|" ./README.md
    - name: Commit any changes to data files, including encrypted tokens
      run: |
        git config --local user.name "harveybarnhard"
        git config --local user.email "${{ secrets.USER_EMAIL }}"
        git add ./data
        git add ./README.md
        git commit -m "Auto-updating Strava data and tokens"
    - name: Push encrypted tokens back to repository
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        force: true

  manhattan:
    # Street coverage for harveybarnhard.com/manhattan. Runs after `build` has
    # pushed refreshed tokens; never refreshes them itself, never blocks `build`.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: endur/manhattan/requirements.txt
    - name: Install dependencies
      run: pip install -r endur/manhattan/requirements.txt
    - name: Decrypt tokens (outside the repo)
      run: |
        gpg --quiet --batch --yes --decrypt --passphrase="$STRAVA_TOKENS_PHRASE" \
          --output "$RUNNER_TEMP/strava_tokens.json" ./data/strava_tokens.json.gpg
      env:
        STRAVA_TOKENS_PHRASE: ${{ secrets.STRAVA_TOKENS_PHRASE }}
    - name: Update coverage
      run: python endur/manhattan/update.py ${{ inputs.rebuild && '--rebuild' || '' }}
      env:
        STRAVA_TOKENS: ${{ runner.temp }}/strava_tokens.json
    - name: Plan next runs
      run: python endur/manhattan/planner.py --if-stale
    - name: Commit coverage
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/strava_tokens.json"
        git config --local user.name "harveybarnhard"
        git config --local user.email "${{ secrets.USER_EMAIL }}"
        git add data/manhattan
        git diff --cached --quiet && exit 0
        git commit -m "Update Manhattan street coverage"
        git pull --rebase
        git push
